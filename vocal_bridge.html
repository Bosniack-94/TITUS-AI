<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TITUS | Vocal Bridge</title>
    <style>
        body {
            background: #030712;
            color: #00f2ff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .waveform {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 100px;
        }

        .bar {
            width: 4px;
            background: #00f2ff;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            transition: height 0.1s ease;
        }

        .status {
            margin-top: 2rem;
            letter-spacing: 2px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="waveform" id="waveform">
        <!-- Bars generated by JS -->
    </div>
    <div class="status" id="status">VOCAL BRIDGE: STANDBY</div>
    <button id="startBtn"
        style="margin-top: 2rem; padding: 10px 20px; background: transparent; border: 1px solid #00f2ff; color: #00f2ff; cursor: pointer;">ENGAGE
        VOCAL LINKS</button>

    <script>
        const waveform = document.getElementById('waveform');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const bars = [];

        // Create 20 bars
        for (let i = 0; i < 20; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '10px';
            waveform.appendChild(bar);
            bars.push(bar);
        }

        function animate() {
            bars.forEach(bar => {
                const h = 10 + Math.random() * (speaking ? 80 : 5);
                bar.style.height = h + 'px';
            });
            requestAnimationFrame(animate);
        }
        animate();

        let speaking = false;

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES'; // Spanish for the user
            utterance.rate = 0.9;
            utterance.pitch = 1.0;

            utterance.onstart = () => { speaking = true; status.innerText = 'TITUS: SPEAKING...'; };
            utterance.onend = () => { speaking = false; status.innerText = 'VOCAL BRIDGE: LISTENING'; };

            window.speechSynthesis.speak(utterance);
        }

        startBtn.onclick = () => {
            startBtn.style.display = 'none';
            speak("Protocolos vocales activados. Sistema TITUS en línea, Jefe. ¿Cuál es su siguiente orden?");
            // In a real scenario, this would poll a file/API for new text to speak.
        };
    </script>
</body>

</html>
