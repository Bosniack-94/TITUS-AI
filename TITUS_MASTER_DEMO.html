<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITUS | Autonomous Logic V3.14</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #010409;
            --sidebar: #0d1117;
            --accent: #00f2ff;
            --accent-dim: rgba(0, 242, 255, 0.1);
            --text: #e6edf3;
            --text-dim: #8b949e;
            --border: rgba(0, 242, 255, 0.15);
            --card: #161b22;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            overflow: hidden;
        }

        /* Side Panel / Telemetry */
        .side-panel {
            width: 320px;
            border-right: 1px solid var(--border);
            background: var(--sidebar);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-family: 'Orbitron';
            font-size: 0.75rem;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .agent-list {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .agent-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            transition: 0.3s;
        }

        .agent-card:hover { border-color: var(--accent); }

        .agent-name { color: var(--accent); font-weight: 600; margin-bottom: 4px; display: block; }
        .agent-state { color: var(--text-dim); font-family: 'JetBrains Mono'; font-size: 0.7rem; }

        /* Main Canvas */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #0d1117 0%, #010409 100%);
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .titus-id { font-family: 'Orbitron'; font-size: 1.2rem; letter-spacing: 4px; }
        .version-tag { font-size: 0.6rem; color: var(--text-dim); opacity: 0.5; }

        .viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* The Thinking Chain */
        .thought-chain {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
            overflow-y: auto;
            max-height: 50vh;
            padding-right: 15px;
        }

        .thought-chain::-webkit-scrollbar { width: 4px; }
        .thought-chain::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .step {
            display: flex;
            gap: 15px;
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .step-icon {
            width: 30px;
            height: 30px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--accent);
            flex-shrink: 0;
            background: var(--accent-dim);
        }

        .step-content {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            flex: 1;
        }

        .step-label { font-size: 0.65rem; color: var(--accent); font-family: 'Orbitron'; margin-bottom: 5px; }
        .step-text { font-size: 0.85rem; line-height: 1.5; color: #d1d5db; }

        /* Command Input */
        .input-container {
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 18px 25px;
            border-radius: 15px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }

        .btn-send {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-family: 'Orbitron';
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-send:hover { box-shadow: 0 0 20px var(--accent-dim); transform: translateY(-50%) scale(1.05); }

        /* Audio Wave */
        .wave-container {
            display: flex;
            gap: 4px;
            height: 40px;
            align-items: center;
        }
        .bar { width: 3px; background: var(--accent); height: 5px; border-radius: 2px; transition: 0.1s; }

    </style>
</head>

<body>
    <div class="side-panel">
        <div class="panel-header">
            <span>TELEMTRÍA_SISTEMA</span>
            <div class="status-dot"></div>
        </div>
        <div class="agent-list">
            <div class="agent-card">
                <span class="agent-name">ORCHESTRATOR</span>
                <span class="agent-state">MONITORING_CORTEX</span>
            </div>
            <div class="agent-card">
                <span class="agent-name">EXECUTOR_MANUS</span>
                <span class="agent-state">IDLE_WAITING_TASKS</span>
            </div>
            <div class="agent-card">
                <span class="agent-name">SENSE_BROWSER</span>
                <span class="agent-state">NETWORK_READY</span>
            </div>
        </div>
        <div style="flex:1"></div>
        <div style="padding: 20px; border-top: 1px solid var(--border); font-size: 0.6rem; color: var(--text-dim);">
            SYSTEM_INTEGRITY: 100%<br>
            CORTEX_SYNC: STABLE
        </div>
    </div>

    <div class="workspace">
        <div class="header">
            <div class="titus-id">TITUS <span style="font-weight: 300;">AUTONOMOUS</span></div>
            <div class="wave-container" id="wave">
                <!-- Bars generated by JS -->
            </div>
            <div class="version-tag">V3.14_RIGOR // STARK_MODEL</div>
        </div>

        <div class="viewport">
            <div class="logo-main" style="text-align: center; margin-bottom: 20px;">
                <h1 style="font-family: 'Orbitron'; font-size: 4rem; letter-spacing: 20px; margin: 0; opacity: 0.1;">TITUS</h1>
            </div>
            
            <div class="thought-chain" id="chain">
                <div class="step">
                    <div class="step-icon">01</div>
                    <div class="step-content">
                        <div class="step-label">SISTEMA_LISTO</div>
                        <div class="step-text">Protocolo de autonomía activado. Esperando comando de mando...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="search-box">
                <input type="text" id="goal-input" placeholder="¿Qué quieres que TITUS haga por ti hoy?">
                <button class="btn-send" id="btn-run">EJECUTAR</button>
            </div>
        </div>
    </div>

    <script>
        const chain = document.getElementById('chain');
        const input = document.getElementById('goal-input');
        const btn = document.getElementById('btn-run');
        const wave = document.getElementById('wave');

        // Audio Wave bars
        for(let i=0; i<15; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            wave.appendChild(bar);
        }
        const bars = Array.from(document.querySelectorAll('.bar'));

        function animateWave() {
            bars.forEach(b => {
                const h = 5 + Math.random() * 25;
                b.style.height = h + 'px';
            });
            requestAnimationFrame(animateWave);
        }
        animateWave();

        function addStep(label, text) {
            const count = chain.children.length + 1;
            const div = document.createElement('div');
            div.className = 'step';
            div.innerHTML = `
                <div class="step-icon">${count.toString().padStart(2, '0')}</div>
                <div class="step-content">
                    <div class="step-label">${label}</div>
                    <div class="step-text">${text}</div>
                </div>
            `;
            chain.appendChild(div);
            chain.scrollTop = chain.scrollHeight;
        }

        async function startAutonomousLoop() {
            const goal = input.value.trim();
            if(!goal) return;

            addStep("OBJETIVO_RECIBIDO", goal);
            input.value = "";
            
            // Trigger API
            try {
                const res = await fetch('http://127.0.0.1:8001/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: goal, and_report: true })
                });
                
                if(res.ok) {
                    addStep("CORTEX_INIT", "Doble Cerebro (Gemini+Claude) sincronizado. Iniciando planificación de tareas...");
                    setTimeout(() => addStep("LLM_THOUGHT", "Plan de 4 pasos generado. Iniciando ejecución táctica..."), 1500);
                } else {
                    addStep("ERROR", "Fallo de conexión con el núcleo central.");
                }
            } catch (e) {
                addStep("ERROR", "No se pudo alcanzar el servidor TITUS Core.");
            }
        }

        btn.onclick = startAutonomousLoop;
        input.onkeydown = (e) => { if(e.key === 'Enter') startAutonomousLoop(); };
    </script>
</body>

</html>
